server:
  port: 9090

spring:
  application:
    name: tokenization-service
  datasource:
    url: jdbc:h2:mem:tokenizationdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console



